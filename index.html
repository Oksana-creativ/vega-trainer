<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>«ВЕГА» · Тренажёр сервиса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --wine:#167C92; --wine-d:#10606F; --wine-l:#2E9AB0; --deep:#103E4A; --main:#155F70;
  --rose:#D6EAF0; --blush:#EAF4F7;
  --bg:#F4F8F9; --surface:#FFFFFF; --ink:#0E2A32; --muted:#55707A; --line:#D3E3E8;
  --good:#2F7D5B; --bad:#C0392B; --gold:#B7791F;
  --shadow:0 1px 0 rgba(16,62,74,.06), 0 8px 24px -16px rgba(16,62,74,.35);
  --serif:"Montserrat", "Segoe UI", Arial, sans-serif;
  --sans:"Open Sans", "Segoe UI", Roboto, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1C21; --surface:#11282F; --ink:#E6F2F5; --muted:#9DB8C0; --line:#1F3F48;
    --rose:#1B4450; --blush:#143139; --good:#7CC9A4; --bad:#F08A72; --gold:#E2B860;
    --wine:#3DB2C9; --wine-l:#62C4D7; --main:#1E7488;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 30px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#0A1C21; --surface:#11282F; --ink:#E6F2F5; --muted:#9DB8C0; --line:#1F3F48;
  --rose:#1B4450; --blush:#143139; --good:#7CC9A4; --bad:#F08A72; --gold:#E2B860;
  --wine:#3DB2C9; --wine-l:#62C4D7; --main:#1E7488;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--wine-l);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0;letter-spacing:-.01em;font-weight:700}
h1{font-size:clamp(28px,4vw,40px)} h2{font-size:24px} h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
img,svg{max-width:100%}

/* shell */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--deep);color:#EAF4F7;padding:28px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:28px}
.brand{font-family:var(--serif);font-size:22px;line-height:1.1}
.brand span{display:block;font-family:var(--sans);font-size:13px;opacity:.7;margin-top:6px;font-weight:400}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{background:none;border:0;text-align:left;padding:11px 14px;border-radius:10px;color:#D6EAF0;display:flex;gap:12px;align-items:center;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current="page"]{background:#EAF4F7;color:#4A0F1A}
.nav svg{width:20px;height:20px;flex:none}
.side .me{margin-top:auto;font-size:14px;opacity:.85}
main{padding:28px clamp(16px,4vw,48px) 100px;max-width:1120px;width:100%}
.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.topbar .who{margin-right:auto}
.who b{font-family:var(--serif);font-size:22px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;font-size:15px}
.gem{width:18px;height:18px;flex:none}
.bottomnav{display:none}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  main{padding:18px 16px 110px}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--deep);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;justify-content:space-around}
  .bottomnav button{background:none;border:0;color:#D6EAF0;display:flex;flex-direction:column;align-items:center;font-size:11px;gap:2px;padding:6px 4px;border-radius:10px;min-width:60px}
  .bottomnav button[aria-current="page"]{background:#EAF4F7;color:#4A0F1A}
  .bottomnav svg{width:22px;height:22px}
}

/* blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{background:var(--wine);color:#fff;border:0;border-radius:12px;padding:12px 20px;font-weight:600}
.btn:hover{background:var(--wine-d)}
.btn.ghost{background:transparent;color:var(--wine);border:1.5px solid var(--wine)}
.btn.ghost:hover{background:var(--blush)}
.btn.sm{padding:8px 14px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--wine);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}
.section{margin-top:36px}
.section>h2{margin-bottom:14px}
.bar{height:8px;border-radius:99px;background:var(--rose);overflow:hidden}
.bar i{display:block;height:100%;background:var(--wine);border-radius:99px;transition:width .5s}

/* hero today */
.hero{background:var(--deep);color:#EAF4F7;border-radius:20px;padding:26px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;position:relative;overflow:hidden}
.hero h1{color:#fff}
.hero .lvl{font-size:15px;opacity:.85;margin-top:8px}
.hero .bar{background:rgba(255,255,255,.15);margin-top:12px;max-width:380px}
.hero .bar i{background:#D6EAF0}
.streak{text-align:right}
.streak b{font-family:var(--serif);font-size:56px;line-height:1;display:block}
@media(max-width:560px){.hero{grid-template-columns:1fr}.streak{text-align:left}}

.task{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.task.done .check{background:var(--wine);border-color:var(--wine);color:#fff}
.task .t{flex:1}
.task .t b{display:block}

.blockcard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.blockcard:hover{border-color:var(--wine-l)}
.blockcard.key{border-left:5px solid var(--wine)}
.tag{display:inline-block;font-size:12.5px;font-weight:600;color:var(--wine);background:var(--blush);border-radius:6px;padding:2px 8px}
.std{margin:0;padding-left:20px}
.std li{margin:6px 0}
.exrow{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:0}
.exrow .ico{width:40px;height:40px;border-radius:10px;background:var(--blush);color:var(--wine);display:grid;place-items:center;flex:none}
.exrow .ico svg{width:22px;height:22px}
.score{font-weight:700;font-variant-numeric:tabular-nums}

/* dialog */
.dlg{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start}
@media(max-width:980px){.dlg{grid-template-columns:1fr}}
.patient{display:flex;gap:14px;align-items:center}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--rose);color:var(--deep);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:22px;flex:none}
.chat{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.msg{max-width:82%;padding:12px 16px;border-radius:16px;line-height:1.45}
.msg.p{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.msg.a{background:var(--main);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.msg .who{font-size:12.5px;opacity:.7;display:block;margin-bottom:2px}
.fb{align-self:stretch;background:var(--blush);border-radius:12px;padding:12px 14px;font-size:14.5px;border-left:4px solid var(--muted)}
.fb.s3{border-left-color:var(--good)} .fb.s2{border-left-color:var(--gold)} .fb.s1,.fb.s0{border-left-color:var(--bad)}
.fb .head{display:flex;gap:10px;align-items:center;font-weight:600;margin-bottom:4px;flex-wrap:wrap}
.delta{font-weight:700;font-variant-numeric:tabular-nums}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.fb .react{font-style:italic;margin-top:6px;color:var(--muted)}
.fb .better{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;line-height:1.45}
.opt:hover{border-color:var(--wine)}
.opt .k{font-weight:700;color:var(--wine);margin-right:8px}
textarea,input[type=text],select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
textarea{min-height:96px;resize:vertical}
.free{margin-top:6px;border:1.5px dashed var(--wine-l);border-radius:14px;padding:14px;background:var(--blush)}

/* meter — the signature element */
.meter{position:sticky;top:20px;background:var(--deep);color:#EAF4F7;border-radius:20px;padding:22px}
.meter .lab{font-size:14px;opacity:.8}
.meter .num{font-family:var(--serif);font-size:84px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;margin:6px 0 4px;display:flex;align-items:baseline;gap:4px}
.meter .num small{font-size:36px}
.meter .zones{position:relative;height:14px;border-radius:99px;background:linear-gradient(90deg,#3f6b75 0 45%,#2b8fa5 45% 70%,#9fe0ec 70% 100%);margin:14px 0 6px}
.meter .mark{position:absolute;top:-6px;width:4px;height:26px;background:#fff;border-radius:2px;transform:translateX(-2px);transition:left .6s cubic-bezier(.2,.8,.2,1)}
.meter .ideal{position:absolute;top:-4px;width:2px;height:22px;background:#E2B860}
.meter .scale{display:flex;justify-content:space-between;font-size:12px;opacity:.7}
.meter .flash{font-weight:700;font-size:20px;height:28px}
.meter .hist{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.meter .hist span{background:rgba(255,255,255,.1);border-radius:6px;padding:2px 8px;font-size:13px;font-variant-numeric:tabular-nums}
@media(max-width:980px){.meter{position:static;order:-1}.meter .num{font-size:64px}}

/* result */
.result{background:var(--deep);color:#EAF4F7;border-radius:20px;padding:26px}
.result h2{color:#fff}
.result .big{font-family:var(--serif);font-size:72px;font-weight:800;line-height:1}
.stars{font-size:28px;letter-spacing:4px;color:#E2B860}
.reward{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-weight:600}
.reward span{display:inline-flex;gap:6px;align-items:center}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted)}
.tw{overflow-x:auto}

/* quiz/sort */
.qopt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;margin-top:10px}
.qopt:hover{border-color:var(--wine)}
.qopt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.qopt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.sortitem{font-family:var(--serif);font-size:26px;text-align:center;padding:30px 10px}
.sortbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sortbtns .btn{padding:18px}
.bad-phrase{font-family:var(--serif);font-size:24px;text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:2px}

/* rating */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end}
.pod{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 4px 4px;padding:16px 10px;text-align:center}
.pod.p1{background:var(--deep);color:#EAF4F7;padding-top:26px;padding-bottom:30px}
.pod .place{font-family:var(--serif);font-size:40px;font-weight:800;line-height:1}
.pod .nm{font-weight:600;margin-top:8px;word-break:break-word}
.tabs{display:inline-flex;background:var(--blush);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--wine);box-shadow:var(--shadow)}
.lb td.n{font-family:var(--serif);font-weight:700;width:40px}
.lb tr.mine{background:var(--blush)}

/* prizes */
.prize{display:flex;flex-direction:column;gap:12px}
.prize .cost{display:flex;align-items:center;gap:6px;font-weight:700;font-size:20px;font-family:var(--serif)}
.badge{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.badge .b{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--rose);font-size:22px;flex:none}
.badge.off{opacity:.45}
.badge.off .b{filter:grayscale(1)}

/* coach */
.range{display:grid;grid-template-columns:1fr 160px 34px;gap:10px;align-items:center;padding:6px 0}
.range input{width:100%;accent-color:var(--wine)}
.journal li{padding:12px 0;border-bottom:1px solid var(--line);list-style:none}
.journal{padding:0;margin:0}
.q-cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.qcard{background:var(--blush);border-radius:14px;padding:16px}
.qcard h3{font-size:17px;margin-bottom:8px}
.qcard ul{margin:0;padding-left:18px}
.scale10{display:flex;gap:6px;flex-wrap:wrap}
.scale10 button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.scale10 button[aria-pressed="true"]{background:var(--wine);color:#fff;border-color:var(--wine)}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--deep);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:92vw;text-align:center}
.toast .gem{vertical-align:-3px}
.blockcard .tag,.qcard .tag{align-self:flex-start}
.onb{max-width:520px;margin:8vh auto;padding:0 16px}
.onb .card{padding:28px}
.note{font-size:14px;color:var(--muted);background:var(--blush);border-radius:10px;padding:10px 14px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
.sit{align-self:stretch;background:var(--rose);border-radius:12px;padding:12px 14px;line-height:1.45}
.sit .who{font-size:12.5px;opacity:.7;display:block;margin-bottom:2px;font-weight:600}
.stage{padding-top:6px}
.stage + .stage{margin-top:14px;border-top:1px solid var(--line);padding-top:16px}
.stage h3{font-size:16px;margin-bottom:2px}
.ordlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.ordli{display:flex;gap:12px;align-items:flex-start;background:var(--blush);border-radius:12px;padding:10px 14px;border-left:4px solid var(--wine-l)}
.ordli.ok{border-left-color:var(--good)} .ordli.no{border-left-color:var(--bad)}
.ordli .num{font-family:var(--serif);font-weight:800;color:var(--wine);min-width:18px}
.exrow .muted.small{line-height:1.3}
main{min-width:0}
.tw table{min-width:560px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================== ДАННЫЕ СТАНДАРТА «ВЕГА», ред. 2.1 ============================== */
const CLINIC = "«ВЕГА»";
const ROLES = ["Администратор","Оператор контакт-центра","Кассир"];
const BLOCKS = [
 {id:"contact", n:"Установление контакта", src:"Разделы 8, 10, 13", std:["Ответить не позднее третьего звонка, улыбка слышна в голосе","По телефону: «Доброе утро» до 12:00, «Добрый день» 12:00–18:00, «Добрый вечер» после 18:00; на ресепшене «Добрый вечер» — после 17:00","«Клиника „ВЕГА“, оператор (Имя)» → «Как я могу к Вам обращаться?» → «Очень приятно, Иван Иванович»","К пациенту — по имени и отчеству; детям до 7 лет — на «ты», с 7 лет — на «Вы» по имени","Проговаривать вслух свои действия: «Сейчас уточню расписание… Да, вижу…»"]},
 {id:"needs", n:"Выявление потребностей", key:true, src:"Раздел 13, этап 2", std:["Не отказывать сухим «сегодня нет» — сначала выяснить ситуацию: «В связи с чем хотите попасть именно сегодня?»","Открытые вопросы и активное слушание: повторение, уточнение, перефразирование, резюме","Обязательно уточнить тип оплаты: по ДМС или самостоятельно — и пометить в программе","При ДМС — сориентировать заказать гарантийное письмо в страховой; дальше пациента ведёт менеджер по ДМС"]},
 {id:"empathy", n:"Эмпатия и активное слушание", src:"Разделы 4, 8", std:["Формула: признать состояние + уточнить факт + дать действие + обозначить срок","«Я вижу, что для Вас это важно. Я понимаю Ваше состояние. Я беру вопрос в работу»","Нельзя сказать «понимаю» и ничего не сделать, спорить с эмоцией, оправдываться («у нас сегодня много людей»)","Нельзя давать медицинские обещания вместо врача и называть цену приблизительно"]},
 {id:"present", n:"Презентация врача и услуг", key:true, src:"Разделы 6, 9", std:["Формула: запрос пациента + решение + преимущество «ВЕГА» + выгода + приглашение к записи","2–3 преимущества, связанные с запросом, через «для Вас это значит…»","Сильные стороны «ВЕГА»: врачи, которых рекомендуют поимённо; понятные объяснения; без лишних назначений; всё в одном месте; умеют работать с детьми; семейная клиника Бердска с 1998 года","Запрещено: «у нас все врачи хорошие», «дешевле, чем у других», «наверное, вам подойдёт», «у врача с 9:00 весь день свободен»"]},
 {id:"objections", n:"Работа с возражениями", key:true, src:"Разделы 13, 15", std:["Техника «ППП»: Пойми — Присоединись — Преодолей","Пойми: выслушать, не перебивая, и выяснить причину открытым вопросом","Присоединись: согласиться с той частью мотива, которая действительно есть","Преодолей: «да…, в то же время…» — конкретная выгода и что входит в услугу; затем вернуть к записи","Никогда не выигрывать спор ценой потери пациента"]},
 {id:"close", n:"Запись, резюме и повторный визит", src:"Разделы 10, 13", std:["Предлагать два конкретных варианта времени, а не «когда удобно» и не «всё свободно»","Резюме: дата, время, ФИО и специализация врача, адрес, подойти за 10–15 минут, паспорт и СНИЛС, подготовка","«Если планы изменятся — позвоните, подберём другое время». «Какие вопросы у Вас ещё есть?»","После приёма на ресепшене: «Как прошёл приём?» → отзыв или отработка → сразу запись к смежному врачу"]},

  o("Приходите, там разберётесь по кабинетам.",0,-14,"«Опять бегать по кабинетам…»","Продаёте набор кабинетов, а не готовый результат."),
  o("Да, конечно, успеете.",1,0,"«Точно?»","Обещание без уточнения деталей.")]},
 {p:"Замена. Справка нужна к пятнице.", opts:[
  o("Сергей, тогда предлагаю пройти медкомиссию у нас целиком: все специалисты в одном здании, администратор проведёт Вас по маршруту кабинетов до готовой справки. К пятнице успеваете. Единая стоимость — 3 900 ₽. Полный чек-лист документов пришлю сообщением.",3,16,"«Звучит удобно».","Преимущество «Медкомиссия без лишней беготни»: единая стоимость, маршрут, срок, чек-лист."),
  o("Терапевт 800, окулист 900, нарколог 1 100… посчитайте сами.",0,-12,"«Сложно как-то…»","Набор кабинетов вместо единой стоимости."),
  o("Пройдёте кабинеты, справку потом сделают.",1,-3,"«Когда потом? Мне к пятнице».","Нет срока готовности — главный страх пациента.")]},
 {p:"Удобно. А завтра утром можно?", opts:[
  o("Завтра есть время в 8:00 или в 9:30 — какое удобнее? Подойдите за 15 минут для оформления, с собой паспорт и водительское удостоверение.",3,12,"«8:00».","Два варианта + подготовка к визиту."),
  o("Приходите в любое время, в живую очередь.",0,-10,"«А очередь большая?»","Неясные правила очереди — красная зона."),
  o("Можно. Во сколько хотите?",1,0,"«Ну… с утра».","Открытый вопрос о времени затягивает решение.")]}
 ]},

{id:"d_obj_price", type:"dialog", block:"objections", title:"«А что так дорого?»", ch:"Звонок", start:55,
 who:{name:"Дмитрий Олегович",ini:"Д",ctx:"Травма колена, травматолог направил на МРТ. Видел цену в Новосибирске дешевле."},
 steps:[
 {p:"МРТ колена у вас 6 800? А что так дорого?", opts:[
  o("Да, вопрос стоимости — существенный момент, хорошо, что Вы сказали. Подскажите, в связи с чем возник вопрос — сравниваете с другой клиникой?",3,10,"«Да, в Новосибирске на полторы тысячи дешевле видел».","ППП: присоединение + открытый вопрос — скрипт из раздела 15."),
  o("Это не дорого, это нормальная цена.",0,-10,"«Для кого как».","Спор с возражением."),
  o("Есть дешевле в Новосибирске, если хотите.",0,-30,"«Так и сделаю». (Кладёт трубку.)","Отказ работать с возражением.",true)]},
 {p:"В Новосибирске на полторы тысячи дешевле видел.", opts:[
  o("Понимаю. Подскажите, а что для Вас важно в этом исследовании, кроме цены?",3,10,"«Чтобы точно сказали, что с мениском. И не ездить никуда лишний раз».","Пойми: выясняете истинный критерий выбора."),
  o("Там, наверное, аппарат хуже.",0,-12,"«А вы откуда знаете?»","Негативно отзываться о конкурентах запрещено."),
  o("Ну так езжайте туда.",0,-40,"«Так и сделаю». (Кладёт трубку.)","Грубость: спор выигран, пациент потерян.",true)]},
 {p:"Чтобы точно сказали, что с мениском. И не ездить лишний раз.", opts:[
  o("Если я правильно понимаю, Вам важны точный результат и экономия времени. Да, стоимость у нас выше, в то же время в неё входит описание врача-рентгенолога и запись на диск, а с заключением Вы сразу можете попасть к травматологу здесь же, без поездок в Новосибирск. Удобно сегодня в 18:40 или завтра в 8:20?",3,16,"«Давайте сегодня в 18:40».","Преодолей: «да…, в то же время…» + что входит + выгода + запись."),
  o("Можем сделать скидку 5%.",1,0,"«Всё равно дороже».","Торг вместо ценности."),
  o("У нас хорошее оборудование.",1,2,"«Ну и что?»","Свойство без выгоды.")]}
 ]},

{id:"d_obj_docs", type:"dialog", block:"objections", title:"«Я плачу деньги — какие документы?»", ch:"Ресепшен", start:50,
 who:{name:"Николай Иванович",ini:"Н",ctx:"Первичный пациент на ресепшене. Отказывается подписывать договор и согласие на обработку данных."},
 steps:[
 {p:"Почему я должен это всё подписывать? Я плачу деньги!", opts:[
  o("Понимаю, что заполнение документов не всегда удобно. Что именно Вас смущает в оформлении?",3,12,"«Да зачем вам мои данные? Потом звонят все кому не лень».","ППП: присоединение + открытый вопрос из скрипта стандарта."),
  o("Такие правила, без подписи не примем.",1,-6,"«Бюрократы…»","«У нас так принято» — запрещённая логика: правило без смысла для пациента."),
  o("Не хотите — не подписывайте, но приёма не будет.",0,-20,"«Тогда я пошёл!»","Ультиматум вместо работы с возражением.",true)]},
 {p:"Зачем вам мои данные? Потом звонят все кому не лень.", opts:[
  o("Понимаю Вас, в последнее время многие сталкиваются с такими опасениями. Ваши данные хранятся в медицинской системе клиники и не передаются третьим лицам. Телефон нужен, чтобы напомнить о визите или перенести приём, если доктор заболеет.",3,14,"«Ну, если только для этого…»","Присоединение + гарантия сохранности + цель — ровно по стандарту."),
  o("Мы никому не звоним.",1,0,"«Ага, конечно».","Нет объяснения цели."),
  o("Это не ко мне, вопросы к руководству.",0,-16,"«Позовите руководство!»","Запрещённая фраза эскалирует конфликт.")]},
 {p:"Ладно. А договор-то зачем?", opts:[
  o("Договор и информированное согласие защищают в первую очередь Вас — фиксируют объём услуги, стоимость и Вашу безопасность. А ещё подписанный договор даёт право на налоговый вычет 13%. Позвольте, я поясню каждый пункт — это займёт пару минут.",3,14,"«Вычет — это хорошо. Давайте».","Выгода для пациента: безопасность + налоговый вычет."),
  o("Положено так.",1,-4,"«Кем положено?»","Без пользы для пациента."),
  o("Без договора налоговый вычет не получите, сами смотрите.",1,0,"«Ну давайте…»","Аргумент верный, но тон давления.")]}
 ]},

{id:"d_close_fgds", type:"dialog", block:"close", title:"Резюме записи на ФГДС", ch:"Звонок", start:60,
 who:{name:"Иван Иванович",ini:"И",ctx:"Разбор реального звонка из стандарта. Время согласовано: завтра в 12:00 на ФГДС."},
 steps:[
 {p:"Да, давайте на завтра на 12:00.", opts:[
  o("Подскажите, обследование Вы будете проходить по ДМС от работодателя или оплата будет самостоятельная?",3,8,"«Самостоятельно».","Тип оплаты — обязательный пункт чек-листа."),
  o("Хорошо, записала. Всего доброго.",0,-15,"«А что с собой брать?..»","Нет оплаты, подготовки и резюме."),
  o("4 500 будет стоить обследование.",1,-3,"«Ага…»","Цена «резко», посреди сбора данных — пример «как нельзя».")]},
 {p:"Самостоятельно. А по деньгам сколько?", opts:[
  o("Хорошо, помечаю. Стоимость ФГДС — 4 500 рублей, проводит врач-эндоскопист Людмила Александровна Инушкевич, опытный специалист.",3,8,"«Хорошо».","Стоимость вместе с презентацией врача."),
  o("4 500.",1,0,"«Понятно».","Цена без ценности."),
  o("Около четырёх с половиной, на кассе точно скажут.",0,-10,"«А точнее?»","Приблизительная цена запрещена.")]},
 {p:"А подготовка какая-то нужна?", opts:[
  o("Обследование проводится строго натощак: последний приём пищи — лёгкий ужин накануне до 20:00; утром не есть, не пить, не курить, не жевать жвачку. С собой — паспорт и направление.",3,10,"«Понял, спасибо».","Полная подготовка — без неё процедуру могут отменить."),
  o("Натощак.",1,-4,"«А пить можно?»","Пример «как нельзя»: подготовка одним словом."),
  o("Посмотрите на сайте.",0,-14,"«Ладно…»","«Смотрите на сайте» — запрещённая фраза.")]},
 {p:"Понял. Всё тогда?", opts:[
  o("Итак, Иван Иванович, я записала Вас на завтра в 12:00 на ФГДС к врачу Инушкевич Людмиле Александровне по адресу: ул. Ленина, 89/9. Подойдите, пожалуйста, за 10 минут для оформления, при себе паспорт и номер СНИЛС. Если планы изменятся — позвоните нам, подберём другое время. Какие вопросы у Вас ещё есть?",3,14,"«Нет, всё понятно. Спасибо!»","Полное резюме по стандарту: дата, время, врач, адрес, за сколько прийти, документы, вопросы."),
  o("Да, ждём Вас.",1,-4,"«А куда приходить?»","Резюме нет — риск неявки."),
  o("Пожалуйста, всего доброго.",0,-10,"«До свидания…»","Формальное закрытие — пример «как нельзя».")]}
 ]},

{id:"d_close_after", type:"dialog", block:"close", title:"После приёма: запись к смежному врачу", ch:"Ресепшен", start:55,
 who:{name:"Наталья Петровна",ini:"Н",ctx:"Вышла от терапевта. Назначены УЗИ щитовидной железы и приём эндокринолога. Работает до 18:00."},
 steps:[
 {p:"Доктор сказал записаться на УЗИ щитовидки и к эндокринологу.", opts:[
  o("Наталья Петровна, как прошёл приём?",3,8,"«Хорошо, доктор всё подробно объяснил».","Обратная связь после приёма — обязанность администратора."),
  o("На какое число?",1,0,"«Не знаю, посмотрим».","Пропущен вопрос о приёме."),
  o("Запись по телефону, позвоните в контакт-центр.",0,-18,"«Я же здесь стою…»","«Это не ко мне». Администратор записывает сам.")]},
 {p:"Хорошо, доктор всё подробно объяснил, очень понравилось.", opts:[
  o("Я очень рада, что всё прошло замечательно. Если Вам понравилось, будем благодарны за отзыв о нашей клинике. А сейчас давайте сразу запишу Вас, чтобы Вы не искали время потом.",3,10,"«Конечно, оставлю. Давайте запишемся».","Просьба об отзыве при позитиве + переход к записи."),
  o("Ну и хорошо.",1,0,"«Ну да…»","Позитив не использован."),
  o("Оставьте отзыв обязательно, нам за это премию дают.",0,-10,"«А, понятно…»","Обсуждать оплату труда при пациенте запрещено.")]},
 {p:"Давайте. Только я работаю до шести.", opts:[
  o("Предлагаю связанный маршрут: в четверг в 18:20 УЗИ щитовидной железы и сразу в 18:50 приём эндокринолога — он посмотрит результат на приёме. Или в субботу в 10:30 и в 11:00. Когда удобнее?",3,14,"«Четверг».","Связанный маршрут + два варианта."),
  o("В субботу всё время свободно, выбирайте.",0,-8,"«Ну… не знаю».","Прямой запрет стандарта: только два конкретных варианта."),
  o("УЗИ в четверг в 18:20, а к эндокринологу потом запишетесь.",1,0,"«Опять приходить?»","Пациентке придётся возвращаться.")]},
 {p:"Четверг.", opts:[
  o("Записала: в четверг в 18:20 — УЗИ щитовидной железы, в 18:50 — приём эндокринолога Олега Игоревича Савина, второй этаж. Напишу время на визитке и пришлю напоминание, накануне Вам позвонят для подтверждения. Если планы изменятся, предупредите нас, пожалуйста, заранее.",3,12,"«Спасибо, очень удобно!»","Повтор времени, врача, места + напоминание + просьба предупредить."),
  o("Записала, четверг.",1,-3,"«А во сколько?»","Нет резюме."),
  o("Приходите в четверг вечером.",0,-10,"«Во сколько точно?»","Неопределённость — риск неявки.")]}
 ]},

{id:"d_kassa", type:"dialog", block:"kassa", title:"Касса: оплата до приёма", ch:"Касса", start:60, roles:["Кассир"],
 meter:{label:"Качество обслуживания", ok:"Пациент оплатил и знает следующий шаг", mid:"Оплата прошла, но с недочётами", no:"Пациент запутался"},
 who:{name:"Анна Петровна",ini:"А",ctx:"Записана к кардиологу на 11:30. Есть скидка по карте постоянного пациента."},
 steps:[
 {p:"(Пациентка подходит к кассе.) Здравствуйте.", opts:[
  o("Добрый день! Подскажите, пожалуйста, к какому врачу и на какое время Вы записаны?",3,10,"«К кардиологу на 11:30, Соколова».","Шаги 1–2 алгоритма кассира."),
  o("Фамилия?",1,-4,"«Соколова…»","Нет приветствия, тон допроса."),
  o("Что у Вас?",0,-10,"«Э… я на приём».","Небрежный тон — красная зона «грубость и холодность».")]},
 {p:"К кардиологу на 11:30, Соколова.", opts:[
  o("Анна Петровна, стоимость приёма кардиолога Олега Николаевича Ершова — 2 600 рублей. Сумма скидки составила 260 рублей, к оплате 2 340 рублей. Вам удобнее оплатить наличными или безналичным расчётом?",3,14,"«Картой».","Чёткая стоимость, скидка и итог отдельно, способ оплаты."),
  o("2 340.",1,-4,"«А скидка учтена?»","Скидка не названа — пациент сомневается."),
  o("Там Вам ещё скидка какая-то, около двух трёхсот.",0,-12,"«Какая скидка? Сколько точно?»","Приблизительная сумма запрещена.")]},
 {p:"Картой. (Оплачивает.)", opts:[
  o("Благодарю Вас! Вот Ваш чек. Пройдите, пожалуйста, на ресепшен для оформления документов.",3,12,"«Спасибо!»","Шаг 5: чек и следующий шаг."),
  o("Всё, идите к врачу.",0,-15,"(Идёт к кабинету без оформления.)","Неверный маршрут: сначала оформление на ресепшене."),
  o("Как Вы себя чувствуете? Давайте сразу запишу на повторный приём?",1,-5,"«Я ещё у врача не была…»","Кассир не обсуждает приём и не записывает — это зона администратора.")]}
 ]},

{id:"d_red_flag", type:"dialog", block:"difficult", title:"Пациенту плохо в холле", ch:"Ресепшен", start:50,
 meter:{label:"Безопасность и доверие", ok:"Пациент в безопасности, холл спокоен", mid:"Помощь оказана с задержкой", no:"Красный флаг пропущен"},
 who:{name:"Пожилой пациент",ini:"П",ctx:"Стоит в очереди на оформление. Бледнеет, держится за стойку."},
 steps:[
 {p:"(Мужчина в очереди бледнеет и держится за стойку.) Что-то мне нехорошо…", opts:[
  o("Присядьте, пожалуйста, вот сюда. Я сейчас же приглашу медицинского сотрудника — оставайтесь на месте, я рядом.",3,20,"(Садится, тяжело дышит.)","Скрипт стандарта для ситуации «пациенту стало плохо в холле»."),
  o("Пройдите к терапевту в 205-й кабинет, он посмотрит.",0,-35,"(Идёт по коридору и оседает на стул.)","Красный флаг: нельзя отправлять пациента искать врача.",true),
  o("Сейчас оформлю Вас, и пойдёте к врачу.",0,-20,"(Пациенту становится хуже.)","Оформление важнее состояния — грубая ошибка.")]},
 {p:"(Сидит.) Давление, наверное…", opts:[
  o("Медицинский сотрудник уже идёт. Я принесу Вам воды. Как я могу к Вам обращаться?",3,12,"«Геннадий Петрович…»","Забота и контакт до прихода медсотрудника."),
  o("Вы таблетки от давления сегодня пили? Может, выпить ещё одну?",0,-20,"«Не помню…»","Медицинские советы вместо врача — опасно."),
  o("(Возвращается к оформлению очереди.)",0,-15,"(Пациент остаётся один.)","Пациента нельзя оставлять одного.")]},
 {p:"(Пациент из очереди) А нас когда примут?", opts:[
  o("Прошу прощения за ожидание. Пациенту стало нехорошо, медицинский сотрудник рядом. Через 2–3 минуты я продолжу оформление — первым приглашу Вас.",3,12,"«Конечно, понимаем».","Техника «Маяк»: информация, время ожидания, порядок."),
  o("Вы что, не видите, человеку плохо?!",0,-12,"«Не надо на меня кричать!»","Повышать тон запрещено."),
  o("(Молча продолжает заниматься пациентом.)",1,-4,"(Очередь нервничает.)","Пациентов нельзя оставлять без информации.")]}
 ]},

{id:"d_delay", type:"dialog", block:"difficult", title:"Задержка приёма врачом", ch:"Ресепшен", start:35,
 meter:{label:"Лояльность пациента", ok:"Пациент сохранил лояльность", mid:"Пациент недоволен, но остался", no:"Пациент ушёл с жалобой"},
 who:{name:"Михаил Сергеевич",ini:"М",ctx:"Записан на 14:00, ждёт с 13:50. Опаздывает на работу."},
 steps:[
 {p:"Я жду уже 40 минут! У меня запись на 14:00!", opts:[
  o("Михаил Сергеевич, понимаю, что Вы огорчены — ждать 40 минут, когда пришли вовремя, неприятно. Прошу прощения за ожидание. Сейчас уточню у доктора точное время.",3,15,"«Ну уточните. У меня работа вообще-то».","СУП: согласие с чувствами + одно извинение + действие."),
  o("У нас сегодня много пациентов, врач не успевает.",1,-6,"«Это ваши проблемы!»","Оправдание — ошибка эмпатии из раздела 4."),
  o("Успокойтесь, пожалуйста.",0,-15,"«Я спокоен! Позовите главного!»","«Успокойтесь» усиливает гнев.")]},
 {p:"(Через минуту) Ну и что?", opts:[

{id:"d_rude", type:"dialog", block:"difficult", title:"Хамство на линии", ch:"Звонок", start:35,
 meter:{label:"Лояльность пациента", ok:"Конфликт погашен, запись сохранена", mid:"Пациент остыл, но недоволен", no:"Пациент ушёл в конфликте"},
 who:{name:"Пациентка",ini:"Г",ctx:"Записали не на тот день. Долго не могла дозвониться. Звонит на взводе."},
 steps:[
 {p:"Да вы там вообще работаете?! Третий день дозвониться не могу, бардак!", opts:[
  o("Прошу прощения, что дозвониться было непросто, понимаю, что Вы сейчас возмущены. Я готова Вам помочь. Как я могу к Вам обращаться?",3,14,"«Галина Ивановна».","Присоединение к ситуации и эмоции — шаг 1 алгоритма при хамстве."),
  o("Не кричите на меня.",0,-15,"«Я ещё не кричала!»","Ответ на эмоцию эмоцией."),
  o("У нас большая нагрузка, все линии заняты.",1,-5,"«Мне какое дело?!»","Оправдание вместо присоединения.")]},
 {p:"Галина Ивановна! Мне анализы сдать надо было, а меня записали не на тот день!", opts:[
  o("Галина Ивановна, я правильно поняла, что Вас записали не на ту дату, о которой договаривались? Подскажите, на какой день Вам было нужно?",3,10,"«На четверг! А смс пришла на пятницу!»","Активное слушание + открытый вопрос, без «Почему?»."),
  o("Это не я Вас записывала.",0,-16,"«Да мне всё равно кто!»","Перекладывание на коллег запрещено."),
  o("Значит, Вы не так поняли.",0,-16,"«Это я не так поняла?!»","Обвинение пациента.")]},
 {p:"На четверг! А смс на пятницу. Вы там совсем ничего не умеете, бездельники!", opts:[
  o("Галина Ивановна, я понимаю, что Вы расстроены, и хочу Вам помочь. Чтобы быстрее решить вопрос, прошу общаться со мной без оскорблений. Сейчас проверю запись и предложу время на четверг.",3,12,"«…Ладно. Проверяйте».","Обозначение границ спокойно, без ответной агрессии."),
  o("Я не буду с Вами так разговаривать. (Кладёт трубку.)",0,-40,"(Короткие гудки. Через час — отзыв в интернете.)","Пациента нельзя «бросать»: сначала границы и помощь.",true),
  o("Сами Вы бездельница.",0,-40,"«Ну всё, я пишу жалобу!»","Ответная грубость — категорический запрет.",true)]},
 {p:"Ладно… Так что с четвергом?", opts:[
  o("Сейчас уточню расписание… Вижу на четверг 7:30 или 8:10. Какое время удобнее? Запись беру под личный контроль: накануне я сама Вам позвоню для подтверждения.",3,14,"«7:30. Спасибо, что разобрались».","Решение + личный контроль + срок."),
  o("Есть 7:30.",1,0,"«Хорошо…»","Решение без заботы о доверии."),
  o("В четверг всё занято, давайте в пятницу, как было.",0,-15,"«Нет уж, спасибо».","Проблема пациента не решена.")]}
 ]},

  const d=mine.filter(e=>e.type==="dialog");
  return {dk:d.filter(key).length?d.filter(key):d, d, p:mine.filter(e=>["quiz","sort","order"].includes(e.type)), r:mine.filter(e=>e.type==="rephrase")};
}
function pick(arr,i,skip){ if(!arr.length) return null; for(let k=0;k<arr.length;k++){ const e=arr[(i+k)%arr.length]; if(S.done[e.id]==null&&!skip.includes(e.id)) return e.id; } for(let k=0;k<arr.length;k++){ const e=arr[(i+k)%arr.length]; if(!skip.includes(e.id)) return e.id; } return null; }
function ensureDaily(){
  const today=dayKey();
  if(S.daily && S.daily.date===today && S.daily.role===S.role) return;
  const i=dayIdx(), P=rolePools(), t=[];
  const a1=pick(P.dk,i,t); if(a1) t.push(a1);
  const a2=pick(P.p,i,t); if(a2) t.push(a2);
  const a3=pick(P.r.length?P.r:P.d,i+3,t); if(a3) t.push(a3);
  const prev=S.daily&&S.daily.date===today?S.daily:null;
  S.daily={date:today, role:S.role, tasks:[...t,"coach"], completed:prev?prev.completed.filter(x=>x==="coach"):[], bonus:false, focus:prev?prev.focus:null, evening:prev?prev.evening:null};
  saveLocal();
}
function markDaily(id){
  ensureDaily();
  if(S.daily.tasks.includes(id) && !S.daily.completed.includes(id)){
    S.daily.completed.push(id);
    if(!S.daily.bonus && S.daily.tasks.every(t=>S.daily.completed.includes(t))){
      S.daily.bonus=true;
      const y=dayKey(new Date(Date.now()-864e5));
      S.streak = (S.lastStreakDay===y) ? S.streak+1 : (S.lastStreakDay===dayKey()?S.streak:1);
      S.lastStreakDay=dayKey();
      const sb=Math.min(50, S.streak>=3 ? S.streak*5 : 0);
      reward(30,50+sb,"Все задания дня выполнены"+(sb?` · серия ${S.streak} дн. +${sb}`:""));
    }
  }
}

/* ============================== НАГРАДЫ ============================== */
function reward(xp,gems,why){
  if(S.week!==weekId()){ S.week=weekId(); S.weekXp=0; }
  S.xp+=xp; S.weekXp+=xp; S.gems+=gems;
  checkBadges(); save();
  toast(`${esc(why)}: +${fmt(gems)} ${gemSvg(16)} · +${fmt(xp)} опыта`);
  haptic("success");
}
function blockStat(bid){ const ex=EX.filter(e=>e.block===bid); const d=ex.filter(e=>S.done[e.id]!=null); return {n:ex.length, done:d.length, pct:d.length?Math.round(d.reduce((a,e)=>a+S.done[e.id],0)/ex.length):null, strong:ex.filter(e=>(S.done[e.id]||0)>=80).length}; }
function checkBadges(){
  const has=id=>S.badges.includes(id), add=id=>{ if(!has(id)){ S.badges.push(id); const b=BADGES.find(x=>x.id===id); setTimeout(()=>toast("Новый значок: "+esc(b.n)),1700);} };
  if(Object.keys(S.done).length) add("first");
  if(blockStat("needs").strong>=15) add("needs");
  if(blockStat("present").strong>=15) add("present");
  if(blockStat("objections").strong>=15) add("obj");
  if(S.history.some(h=>h.conv>=90)) add("conv90");
  if(Object.entries(S.best||{}).some(([ch,n])=>COACH[ch]&&n>=COACH[ch].check.length)) add("check9");
  if(S.free>=5) add("free5");
  if(S.calmN>=10) add("calm10");
  if(S.streak>=3) add("streak3");
  if(S.streak>=7) add("streak7");
  if(S.journal.length>=5) add("coach5");
}

  if(ex.type==="quiz"){ E.right=0; E.ans=null; }
  if(ex.type==="sort"){ E.items=shuffle(ex.items); E.right=0; E.ans=null; }
  if(ex.type==="order"){ E.pool=shuffle(ex.items.map((_,k)=>k)); E.picked=[]; E.checked=false; }
  if(ex.type==="rephrase"){ E.sc=[]; E.cur=null; }

function viewDialog(){

function applyStep(ans){
  const ex=E.ex, sit=ex.steps[E.i].sit;
  E.log.push({w:"a",t:ans.t,free:ans.free,sit});
  E.conv=clamp(E.conv+ans.c,0,100);
  E.flash=(ans.c>0?"+":"")+ans.c+"%";
  E.scores.push(ans.s); E.deltas.push(ans.c);
  E.log.push({w:"fb",s:ans.s,c:ans.c,f:ans.f,r:ans.end?null:ans.r,free:ans.free,ai:ans.ai,better:ans.better});
  haptic(ans.s>=2?"success":"error");
  if(ans.free && ans.s>=2) S.free++;
  const lost = ans.end || (E.conv<=15 && !ex.mini);
  if(lost){ E.log.push({w:"p",t:ans.r||"Ладно, я, пожалуй, обращусь в другое место."}); finishDialog(true); return; }
  E.i++; E.free=false;
  if(E.i>=ex.steps.length){ finishDialog(false); return; }
  E.order=shuffle([0,1,2]);
  E.log.push({w:"p",t:ex.steps[E.i].p,sit:ex.steps[E.i].sit});
  render();
  const last=document.querySelector(".chat > :last-child"); if(last) last.scrollIntoView({block:"center",behavior:"smooth"});
}
function finishDialog(lost){
  const ex=E.ex, n=ex.steps.length;
  const avg=E.scores.reduce((a,b)=>a+b,0)/(3*n);
  const pct=Math.round((avg*.6+E.conv/100*.4)*100);
  const stars = E.conv>=80&&avg>=.8?3:E.conv>=60?2:E.conv>=40?1:0;
  const gems = ex.mini ? stars*8 : stars*10+(E.conv>=70?10:0);
  finishEx(pct, ex.mini?Math.round(pct*.6):pct, gems, {conv:E.conv, lost, stars, avg});
}
function finishEx(pct,xp,gems,extra={}){
  const id=E.ex.id, prev=S.done[id];
  const mult = prev==null?1:(pct>prev?.6:.25);
  S.done[id]=Math.max(prev||0,pct);
  S.history.push({d:dayKey(),ex:id,pct,conv:extra.conv??null});
  E.done=true; E.res=Object.assign({pct,xp:Math.round(xp*mult),gems:Math.round(gems*mult),first:prev==null,mult},extra);
  if(E.res.xp||E.res.gems) reward(E.res.xp,E.res.gems,prev==null?"Задание пройдено":(pct>prev?"Новый рекорд":"Повторная тренировка"));
  markDaily(id); save(); render(); window.scrollTo({top:0});
}

/* ---------- оценка свободного ответа ---------- */
function heuristic(text, block, extraKeys=[], needQ=false){
  const t=" "+text.toLowerCase().replace(/ё/g,"е")+" ";
  const keys=[...new Set([...extraKeys,...(BLOCK_KEYS[block]||[])])].map(k=>k.toLowerCase().replace(/ё/g,"е"));
  const hits=keys.filter(k=>t.includes(k));
  const bad=BAD.filter(b=>t.includes(b.replace(/ё/g,"е")));
  let s=0; const len=text.trim().length;
  if(len>=20) s=1; if(hits.length>=2) s=2; if(hits.length>=3&&len>=50) s=3;
  if(needQ && !text.includes("?")) s=Math.min(s,1);
  if(bad.length) s=Math.max(0,s-2);
  if(len<10) s=0;
  const f=[bad.length?`Есть фраза, запрещённая стандартом: «${bad[0]}».`:"",
    hits.length?`Элементы стандарта в ответе: ${hits.slice(0,4).map(h=>"«"+h.trim()+"»").join(", ")}.`:"Не найдено ключевых элементов стандарта этого блока.",
    needQ&&!text.includes("?")?"Нужен открытый вопрос.":"", s<3?"Сравните с эталоном.":""].filter(Boolean).join(" ");
  return {s,c:(E&&E.ex.mini?DLT:[-15,-5,6,12])[s],f,r:["Мне такое не нравится…","Хм… и что дальше?","Ну, допустим…","Да, хорошо, давайте так."][s]};
}
async function evalFree(text){

  const best=st.opts.reduce((a,x)=>x.s>a.s?x:a,st.opts[0]);
  if(ENV.sample){
    try{
      const prompt=`Ты — бизнес-тренер по «Стандартам пациентоориентированного сервиса» частной клиники «ВЕГА» (Бердск, ред. 2.1) и одновременно играешь пациента в тренажёре.
Канал: ${ex.ch}. Блок стандарта: «${b.n}». Правила блока: ${b.std.join("; ")}.
Общие правила «ВЕГИ»: обращение по имени и отчеству; проговаривать действия вслух; уточнять тип оплаты; два варианта времени; точная стоимость; без медицинских обещаний вместо врача; не оправдываться и не обвинять коллег; возражения — по «ППП», конфликт — по «СУП»; запрещённые фразы: «не знаю», «это не ко мне», «ничем не могу помочь», «звоните позже», «смотрите на сайте», «у нас все врачи хорошие», «к сожалению», «у нас так принято», «успокойтесь».
Ситуация: ${ex.who.ctx}
${st.sit?"Что происходит":"Реплика пациента"}: «${st.p}»
${st.sit?"Действие сотрудника":"Ответ сотрудника"}: «${text}»
Эталон: «${best.t}»
Верни только JSON: {"score":0-3,"conversion_delta":целое от -30 до 30,"patient_reply":"реакция пациента, 1-2 предложения","feedback":"что получилось и что улучшить, 1-2 предложения","better":"усиленная версия ответа","hangup":false}`;
      const j=await ENV.sample.json(prompt,{modelTier:"quick"});
      return {t:text,s:clamp(parseInt(j.score)||0,0,3),c:clamp(parseInt(j.conversion_delta)||0,-30,30),r:String(j.patient_reply||""),f:String(j.feedback||""),better:String(j.better||best.t),end:!!j.hangup&&!ex.mini,free:true,ai:true};
    }catch(e){ if(e&&e.code==="not_granted") ENV.sample=null; }
  }
  return Object.assign(heuristic(text,ex.block),{t:text,free:true,better:best.t});
}

function radarSvg(){
  const n=BLOCKS.length, cx=160, cy=150, R0=110;
  const pt=(i,val)=>{const a=-Math.PI/2+i*2*Math.PI/n; return [cx+Math.cos(a)*R0*val/10, cy+Math.sin(a)*R0*val/10];};
  const poly=vals=>vals.map((val,i)=>pt(i,val).map(x=>x.toFixed(1)).join(",")).join(" ");
  const self=BLOCKS.map(b=>S.wheel[b.id]||0), fact=BLOCKS.map(b=>(blockStat(b.id).pct||0)/10);
  const rings=[2.5,5,7.5,10].map(x=>`<polygon points="${poly(Array(n).fill(x))}" fill="none" stroke="var(--line)"/>`).join("");
  const labels=BLOCKS.map((b,i)=>{const [x,y]=pt(i,12.4); return `<text x="${x}" y="${y}" font-size="10" text-anchor="middle" fill="var(--muted)" font-family="Open Sans, sans-serif">${esc(b.n.split(" ")[0].replace(/[,:]$/,""))}</text>`;}).join("");
  return `<svg viewBox="-45 0 410 300" role="img" aria-label="Колесо навыков">${rings}${labels}
   <polygon points="${poly(fact)}" fill="var(--wine)" fill-opacity=".25" stroke="var(--wine)" stroke-width="2"/>
   <polygon points="${poly(self)}" fill="none" stroke="var(--gold)" stroke-width="2" stroke-dasharray="5 4"/></svg>`;
}

    <div class="card">${radarSvg()}<p class="small"><span style="color:var(--gold);font-weight:700">- - -</span> самооценка · <span style="color:var(--wine);font-weight:700">▬</span> результат в тренажёре</p><ul class="small" style="padding-left:18px">${gapTxt}</ul></div></div></section>

document.addEventListener("click", async ev=>{
  const t=ev.target.closest("button"); if(!t||t.disabled) return;
  const ds=t.dataset;
  if(ds.go){ go(ds.go); return; }
  if(ds.block){ go("block",{id:ds.block}); return; }
  if(ds.start){ startEx(ds.start); return; }
  if(ds.opt!=null && E && !E.busy){ applyStep(Object.assign({},E.ex.steps[E.i].opts[+ds.opt])); return; }
  if(ds.qa!=null){ E.ans=+ds.qa; const ok=E.ans===E.ex.qs[E.i].a; if(ok) E.right++; haptic(ok?"success":"error"); render(); return; }
  if(ds.sa!=null){ E.ans=+ds.sa; const ok=E.ans===E.items[E.i][1]; if(ok) E.right++; haptic(ok?"success":"error"); render(); return; }
  if(ds.ord!=null){ E.picked.push(+ds.ord); render(); return; }
  if(ds.rate){ E.rate=+ds.rate; document.querySelectorAll("[data-rate]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.rate===ds.rate)); return; }
  if(ds.erate){ R.erate=+ds.erate; document.querySelectorAll("[data-erate]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.erate===ds.erate)); return; }
  if(ds.rt){ RT.tab=ds.rt; render(); return; }
  if(ds.rr){ RT.role=ds.rr; render(); return; }
  if(ds.calm){ S.calm=S.calm||{}; if(S.calm[ds.calm]===dayKey()) return; S.calm[ds.calm]=dayKey(); S.calmN=(S.calmN||0)+1; reward(1,3,"Саморегуляция"); render(); return; }
  if(ds.redeem){ const p=PRIZES.find(x=>x.id===ds.redeem); if(!p||S.gems<p.c) return;
    if(!(await askConfirm(`Обменять ${fmt(p.c)} алмазов на «${p.n}»?`))) return;
    S.gems-=p.c; const code="ПР-"+Math.random().toString(36).slice(2,6).toUpperCase(); S.redeemed.push({id:p.id,d:dayKey(),code}); save();
    if(ENV.mode==="tg"){ try{ await api("redeem",{prize:p.n,cost:p.c,code}); }catch(e){} }
    render(); toast(`Приз ваш! Код для руководителя: ${code}`); return; }
  const a=ds.act; if(!a) return;
  if(a==="onb"){
    const n=document.getElementById("onbName").value.trim(); if(!n){ document.getElementById("onbName").focus(); return; }
    const role=document.getElementById("onbRole").value;
    const tEl=document.getElementById("onbTeam");
    if(tEl){ const code=tEl.value.trim(); if(!code){ tEl.focus(); return; } S.team=code;
      try{ const r=await api("board"); if(r.error==="team"){ S.team=""; toast("Неверный код клиники"); return; } ENV.needTeam=false; setBoard(r.board); }catch(e){ toast("Нет связи с сервером рейтинга"); return; } }
    S.name=n; S.role=role; S.daily=null; save(); render(); return; }
  if(a==="team"){ const code=document.getElementById("teamCode").value.trim(); if(!code) return; S.team=code;
    try{ const r=await api("board"); if(r.error==="team"){ S.team=""; toast("Неверный код клиники"); return; } ENV.needTeam=false; setBoard(r.board); save(); render(); }catch(e){ toast("Нет связи с сервером рейтинга"); } return; }
  if(a==="freeToggle"){ E.free=!E.free; render(); if(E.free) document.getElementById("freeTxt")?.focus(); return; }
  if(a==="freeSend"){ const txt=document.getElementById("freeTxt").value.trim(); if(txt.length<3) return; E.busy=true; render(); const res=await evalFree(txt); E.busy=false; applyStep(res); return; }
  if(a==="qnext"){ E.i++; E.ans=null; if(E.i>=E.ex.qs.length){ const n=E.ex.qs.length; finishEx(Math.round(E.right/n*100), Math.round(E.right/n*60), E.right*4); } else render(); return; }
  if(a==="snext"){ E.i++; E.ans=null; if(E.i>=E.items.length){ const n=E.items.length; finishEx(Math.round(E.right/n*100), Math.round(E.right/n*60), E.right*4); } else render(); return; }
  if(a==="ordUndo"){ E.picked.pop(); render(); return; }
  if(a==="ordCheck"){ E.checked=true; const ok=E.picked.filter((k,i)=>k===i).length; haptic(ok===E.picked.length?"success":"warning"); render(); return; }
  if(a==="ordDone"){ const n=E.ex.items.length, ok=E.picked.filter((k,i)=>k===i).length; finishEx(Math.round(ok/n*100), Math.round(ok/n*60), ok*3); return; }
  if(a==="rcheck"){ const txt=document.getElementById("rTxt").value.trim(); if(txt.length<3) return; E.busy=true; render(); E.cur=await evalRephrase(txt); E.busy=false; E.sc.push(E.cur.s); if(E.cur.s>=2) S.free++; haptic(E.cur.s>=2?"success":"error"); render(); return; }
  if(a==="rnext"){ E.i++; E.cur=null; if(E.i>=E.ex.items.length){ const sum=E.sc.reduce((x,y)=>x+y,0), n=E.ex.items.length; const pct=Math.round(sum/(3*n)*100); finishEx(pct, Math.round(pct*.8), sum*3); } else render(); return; }
  if(a==="reflect"){
    const co=COACH[E.ex.ch]||COACH["Звонок"];
    const qa=[...document.querySelectorAll("[data-jq]")].map(el=>[el.closest("label").querySelector("span").textContent, el.value.trim()]);
    const ch=[...document.querySelectorAll("[data-chk]")]; const n=ch.filter(x=>x.checked).length;
    if(!qa.some(p=>p[1]) && !E.rate && !n) { toast("Ответьте хотя бы на один вопрос"); return; }
    if(ch.length){ S.best=S.best||{}; S.best[E.ex.ch]=Math.max(S.best[E.ex.ch]||0,n); }
    S.journal.push({d:dayKey(),ex:E.ex.id,title:E.ex.title,ch:E.ex.ch,rate:E.rate||null,qa,chk:ch.length?n:null,chkMax:ch.length||null}); E.reflected=true;
    let verdict=""; if(ch.length){ const [a1,a2]=co.lv; verdict=` · ${n} из ${ch.length} — ${n>=a1?co.vd[0]:n>=a2?co.vd[1]:co.vd[2]}`; }
    reward(0,5,"Рефлексия"+verdict); render(); return; }
  if(a==="focus"){ S.daily.focus={block:document.getElementById("fBlock").value,goal:document.getElementById("fGoal").value.trim(),phrase:document.getElementById("fPhrase").value.trim()}; reward(5,10,"Фокус дня"); render(); return; }
  if(a==="evening"){ if(!R.erate){ toast("Оцените день от 1 до 10"); return; }
    const re=ROLE_EVE[S.role]||ROLE_EVE["Администратор"];
    const qa=re.q.map((q,k)=>[q,(document.getElementById("e"+k)||{}).value?.trim()||""]);
    S.daily.evening={rate:R.erate}; S.journal.push({d:dayKey(),ex:"day",title:"Итоги дня",ch:"",rate:R.erate,qa}); reward(10,15,"Итоги дня"); markDaily("coach"); save(); render(); return; }
});

        ENV.db=db; ENV.mode="claude";
        try{ const snap=await db.doc("data/users/"+ENV.uid+"/progress").get();
          if(snap.exists){ const d=snap.data(); if(d&&d.json&&(d.updatedAt||0)>(S.updatedAt||0)){ S=Object.assign(blank(),JSON.parse(d.json)); saveLocal(); } } }catch(e){}
        db.collection("board").orderBy("xp","desc").limit(200).onSnapshot(qs=>{ ENV.board=qs.docs.map(x=>({id:x.id,data:x.data()})); if(R.v==="rating"||R.v==="today") render(); },()=>{});
        if(S.name) syncRemote();
      }
    }catch(e){}
    if(!E||R.v!=="ex") render();
  }
})();

</script>
